name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Build for device and upload to TestFlight"
        type: boolean
        required: false
        default: false

jobs:
  validate:
    name: Build for Simulator (validation)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project AltMobilePlay.xcodeproj \
            -scheme AltPlay \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

  testflight:
    name: Upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true
    runs-on: macos-26
    timeout-minutes: 30
    needs: validate
    env:
      APP_ID: ${{ secrets.APP_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
      MATCH_REPOSITORY: ${{ secrets.MATCH_REPOSITORY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install fastlane dependencies
        run: bundle install

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Disable Git Credential Manager (match uses Authorization header)
        run: git config --global credential.helper ""

      - name: Run fastlane push_to_testflight
        run: bundle exec fastlane push_to_testflight
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
